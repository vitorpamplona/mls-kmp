name: Create Release Assets

on:
  push:
    tags:
    - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10

jobs:
  # Releases go to Nostr + Blossom only, through Magpie's publishToNostr (the plugin version is in
  # settings.gradle.kts, the relays in gradle.properties). Maven Central has no release after 1.3.0:
  # the bindings and Amethyst take mls-kmp from Nostr + Blossom, and Central's monthly release-size
  # limit kept failing the deploy. The job runs the checks, uploads every file to the release key's
  # Blossom servers (kind 10063) and signs one release event (kind 3071), sent to the key's own
  # relays (its kind 10002 and nostr.json). The key never reaches CI: MAGPIE_BUNKER is a NIP-46
  # bunker URI, so the signer approves each release (the job waits for it), and
  # vitorpamplona.com/.well-known/nostr.json must name the key as "releases" or Magpie refuses to
  # sign. A version already on Nostr fails the job: releases are immutable. macOS, so allTests
  # covers the Apple targets.
  nostr:
    runs-on: macOS-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Cached Konan
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('**/*.gradle*') }}-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-konan-

      - name: Linter (gradle)
        run: ./gradlew spotlessCheck

      - name: Check
        run: ./gradlew allTests

      # Tag v1.2.3 publishes version 1.2.3.
      - name: Set version for tag
        run: |
          echo "ORG_GRADLE_PROJECT_VERSION_NAME=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Publish to Nostr
        run: ./gradlew :mls:publishToNostr --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
          MAGPIE_BUNKER: ${{ secrets.MAGPIE_BUNKER }}

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          generate_release_notes: true
