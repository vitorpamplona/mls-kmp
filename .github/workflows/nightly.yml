name: Nightly hardening

# The long runs of the suites every build runs briefly: more fuzzing, more
# and longer group simulations, and the disabled-check mutation campaign.
# Each prints the seed it used; MLSKMP_FUZZ_SEED / MLSKMP_SIM_SEED replay it.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

jobs:
  long-runs:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: fuzz
            env: MLSKMP_FUZZ_ITERATIONS=20000
            tests: --tests com.vitorpamplona.mls.fuzz.*
          - name: simulation
            env: MLSKMP_SIM_RUNS=60 MLSKMP_SIM_STEPS=400
            tests: --tests com.vitorpamplona.mls.sim.*
    name: ${{ matrix.name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Long ${{ matrix.name }} run
        run: env ${{ matrix.env }} ./gradlew :mls:jvmTest --rerun ${{ matrix.tests }}

  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Warm the build
        run: ./gradlew :mls:jvmTest --tests com.vitorpamplona.mls.group.*

      - name: Disable each validation check in turn
        run: python3 tools/mutation/disable-checks.py --strict --report mutation-report.md

      - name: Report
        if: always()
        run: cat mutation-report.md >> $GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: mutation-report
          path: mutation-report.md

  # The mlswg interop test-runner drives live clients over gRPC through every
  # scenario in its configs: mls-kmp in every role, then mls-kmp against
  # OpenMLS's interop client in every pairing.
  mlswg-interop:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # mls-implementations, at the commit interop-client/src/main/proto/mls_client.proto is vendored from.
      MLS_IMPLEMENTATIONS_REV: 2034fe72e0c805a683ba76165660c834f2a8142a
      OPENMLS_TAG: v0.9.2  # as tools/openmls-verifier/run.sh
      INTEROP_CONFIGS: welcome_join application commit external_join external_proposals reinit branch
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 21

      - uses: actions/setup-go@v6
        with:
          go-version: '1.24'

      - name: Build the test-runner
        run: |
          sudo apt-get update -q && sudo apt-get install -y protobuf-compiler
          # The generators that match the protobuf and grpc versions mls-implementations' go.mod pins.
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.33.0
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.3.0
          git init -q $RUNNER_TEMP/mls-implementations
          cd $RUNNER_TEMP/mls-implementations
          git fetch -q --depth 1 https://github.com/mlswg/mls-implementations.git $MLS_IMPLEMENTATIONS_REV
          git checkout -q FETCH_HEAD
          cd interop
          export PATH=$PATH:$(go env GOPATH)/bin
          protoc --go_out=proto --go_opt=paths=source_relative --go-grpc_out=proto --go-grpc_opt=paths=source_relative -I proto mls_client.proto
          # The repo pins no go.sum entries for these imports; let go fill them in.
          cd test-runner && go build -mod=mod -o $RUNNER_TEMP/test-runner .

      - name: Start the mls-kmp client
        run: |
          ./gradlew :interop-client:installDist
          interop-client/build/install/interop-client/bin/interop-client -port 50001 > $RUNNER_TEMP/mls-kmp-client.log 2>&1 &
          timeout 60 bash -c 'until (echo > /dev/tcp/localhost/50001) 2>/dev/null; do sleep 1; done'

      # mls-kmp implements only ciphersuite 0x0001, so the scripts that move a
      # group to another ciphersuite can't run.
      - name: mls-kmp in every role
        run: |
          python3 tools/interop/run-configs.py --title "mls-kmp in every role" \
            --runner $RUNNER_TEMP/test-runner --configs $RUNNER_TEMP/mls-implementations/interop/configs \
            --client localhost:50001 --skip-cipher-suite-changes \
            --results $RUNNER_TEMP/results/mls-kmp --report $GITHUB_STEP_SUMMARY \
            $INTEROP_CONFIGS

      # Not yet seen green: kept from failing the nightly until it has been.
      # OpenMLS's interop client implements no ReInit, branch, external signer,
      # NewMemberAdd or GroupContextExtensions RPC, and panics in HandleCommit
      # on its own resumption PSK proposal (it doesn't record it as its own),
      # which poisons its state for every later call. So those scripts are left
      # out, and each config gets a fresh OpenMLS client.
      - name: mls-kmp with OpenMLS
        continue-on-error: true
        run: |
          git clone --quiet --depth 1 --branch $OPENMLS_TAG https://github.com/openmls/openmls.git $RUNNER_TEMP/openmls
          (cd $RUNNER_TEMP/openmls/interop_client && cargo build --release)
          python3 tools/interop/run-configs.py --title "mls-kmp with OpenMLS" \
            --runner $RUNNER_TEMP/test-runner --configs $RUNNER_TEMP/mls-implementations/interop/configs \
            --client localhost:50001 --client localhost:50002 --skip-cipher-suite-changes \
            --fresh-client "$RUNNER_TEMP/openmls/target/release/interop_client --port 50002" --fresh-port 50002 \
            --skip-action reinit --skip-action branch --skip-action newMemberAddProposal \
            --skip-action addExternalSigner --skip-action externalSignerProposal \
            --skip-action groupContextExtensionsProposal --skip-action resumptionPSKProposal \
            --results $RUNNER_TEMP/results/openmls --report $GITHUB_STEP_SUMMARY \
            $INTEROP_CONFIGS

      - name: Client logs
        if: always()
        run: tail -n 200 $RUNNER_TEMP/*-client.log $RUNNER_TEMP/results/openmls/*-client.log || true

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: mlswg-interop-results
          path: ${{ runner.temp }}/results
          if-no-files-found: ignore
