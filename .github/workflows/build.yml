name: Test/Build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macOS-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Cached Konan
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('**/*.gradle*') }}-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-konan-

      - name: Cache gradle
        uses: actions/cache@v6
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Linter (gradle)
        run: ./gradlew spotlessCheck

      - name: Check public API against mls/api
        # A change to the public API must update the dump (./gradlew updateKotlinAbi), so it shows up in review.
        run: ./gradlew checkKotlinAbi

      - name: Check JVM
        run: ./gradlew jvmTest

      - name: Check Android (host)
        if: matrix.os == 'ubuntu-latest'
        run: ./gradlew testAndroidHostTest

      - name: Check Linux
        if: matrix.os == 'ubuntu-latest'
        run: ./gradlew linuxX64Test

      - name: Check iOS
        if: matrix.os == 'macOS-latest'
        run: ./gradlew iosSimulatorArm64Test

      - name: Check macOS
        if: matrix.os == 'macOS-latest'
        run: ./gradlew macosArm64Test

      - name: Build (gradle)
        run: ./gradlew assemble --no-daemon

  # What mls-kmp SENDS, replayed by independent implementations: mls-kmp writes
  # passive-client vectors (Welcomes, every commit shape, proposals by
  # reference, external joins, PSKs) and ts-mls and OpenMLS must follow them.
  sending-interop:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tools/openmls-verifier/build
            tools/mlsrs-verifier/build
          key: ${{ runner.os }}-rust-verifiers-${{ hashFiles('tools/openmls-verifier/*', 'tools/mlsrs-verifier/*') }}

      - name: Write mls-kmp-authored vectors
        # --rerun: the variable is not a task input, so a cached result would write nothing.
        run: MLSKMP_PASSIVE_VECTORS=$RUNNER_TEMP/mls-kmp-passive.json ./gradlew :mls:jvmTest --rerun --tests com.vitorpamplona.mls.MlsKmpAuthoredVectorsWriter

      - name: ts-mls replays them
        working-directory: tools/tsmls-vector-gen
        run: |
          npm install --legacy-peer-deps
          node verify-passive-client.mjs $RUNNER_TEMP/mls-kmp-passive.json

      - name: mls-kmp joins ts-mls groups by external commit, ts-mls verifies
        run: |
          node tools/tsmls-vector-gen/external-join.mjs fixture $RUNNER_TEMP/extjoin-fixture.json
          MLSKMP_EXTJOIN_FIXTURE=$RUNNER_TEMP/extjoin-fixture.json MLSKMP_EXTJOIN_RESULT=$RUNNER_TEMP/extjoin-result.json \
            ./gradlew :mls:jvmTest --rerun --tests com.vitorpamplona.mls.ExternalJoinFromTsMls
          node tools/tsmls-vector-gen/external-join.mjs verify $RUNNER_TEMP/extjoin-fixture.json $RUNNER_TEMP/extjoin-result.json

      - name: OpenMLS replays them
        run: tools/openmls-verifier/run.sh $RUNNER_TEMP/mls-kmp-passive.json

      - name: mls-rs replays them
        run: tools/mlsrs-verifier/run.sh $RUNNER_TEMP/mls-kmp-passive.json
