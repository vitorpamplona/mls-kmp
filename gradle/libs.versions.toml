[versions]
agp = "9.4.1"
kotlin = "2.4.21"
android-minSdk = "26"
android-compileSdk = "37"
mavenPublish = "0.37.0"
spotless = "8.10.4"
kotlinxSerialization = "1.12.0"
# SHA, HMAC, HKDF, AES-GCM, X25519, Ed25519 and secure random: vitorpamplona/crypto-kmp.
cryptoKmp = "1.0.0"

[libraries]
crypto = { module = "com.vitorpamplona.crypto:crypto", version.ref = "cryptoKmp" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

[plugins]
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
androidKotlinMultiplatformLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
vanniktech-mavenPublish = { id = "com.vanniktech.maven.publish", version.ref = "mavenPublish" }
diffplugSpotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
